server {
    listen 8080;
    server_name _;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;

    root /usr/share/nginx/html;
    index index.html;

    # DNS interno de Docker, con re-resolución: si la API se recrea y cambia de IP,
    # el proxy la encuentra sin reiniciar nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # El navegador usa un solo origen: el front y la API salen por este puerto,
    # por lo que no hace falta CORS.
    location /api/ {
        # Con variable, nginx reenvía la URI original (ruta y query) sin reescribirla.
        set $api http://teleandes_api:8000;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # El front aborta a los 8 s; el proxy corta un poco después.
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
    }

    location / {
        try_files $uri $uri/ =404;
        # El navegador revalida (ETag) en cada carga: sin esto puede quedarse con
        # módulos JS viejos en caché tras un despliegue.
        add_header Cache-Control "no-cache" always;
        # Un add_header dentro de un location anula los del server: se repiten aquí.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Frame-Options "DENY" always;
    }
}
